name: Préparer les données météo
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Chemin du profil JSON du lieu.
        required: true
        default: site.json
permissions:
  contents: read
concurrency:
  group: weather-local-site
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/weather/site.json
          key: weather-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-site-v1-
      - name: Préparer le bulletin avec le moteur commun
        id: bulletin
        continue-on-error: true
        uses: ./
        with:
          profile: ${{ inputs.profile }}
          state: .cache/weather/site.json
          collect: 'true'
        env:
          METEO_FRANCE_API_KEY: ${{ secrets.METEO_FRANCE_API_KEY }}
      - name: Conserver les acquisitions disponibles
        if: always() && hashFiles('.cache/weather/site.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/weather/site.json
          key: weather-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fournir l'aperçu sans publication
        if: always() && steps.bulletin.outputs.site-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-meteo-preview
          path: ${{ steps.bulletin.outputs.site-directory }}
          include-hidden-files: true
      - name: Signaler une préparation incomplète
        if: always() && steps.bulletin.outcome == 'failure'
        run: exit 1
