name: Préparer les données météo
run-name: ${{ inputs.request_id && format('Mise à jour {0}', inputs.request_id) || 'Collecte météo' }}
on:
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Données à récupérer.
        type: choice
        options: [all, piaf, forecast, cached]
        default: all
      publish:
        description: Publier le site préparé.
        type: boolean
        default: false
      request_id:
        description: Identifiant de la demande de l’administration.
        required: false
permissions:
  contents: read
concurrency:
  group: weather-local-site
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository != 'nicklausFR/bulletin-local-meteo-france'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.bulletin.outputs.site-directory != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire le fichier privé
        id: config
        env:
          BULLETIN_CONFIG: ${{ secrets.BULLETIN_CONFIG }}
        run: node scripts/private-config.mjs
      - name: Choisir la collecte
        id: collect
        env:
          REQUESTED_GROUP: ${{ inputs.group }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const group = process.env.REQUESTED_GROUP || (process.env.SCHEDULE === '17 * * * *' ? 'forecast' : 'piaf');
          appendFileSync(process.env.GITHUB_OUTPUT, 'group=' + group + '\n');
          NODE
      - uses: actions/cache/restore@v4
        with:
          path: .cache/weather/site.json
          key: weather-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-site-v1-
      - name: Préparer le bulletin
        id: bulletin
        uses: ./
        with:
          profile: ${{ steps.config.outputs.profile }}
          state: .cache/weather/site.json
          collect: ${{ steps.collect.outputs.group != 'cached' }}
          group: ${{ steps.collect.outputs.group == 'cached' && 'all' || steps.collect.outputs.group }}
      - name: Conserver les acquisitions disponibles
        if: always() && hashFiles('.cache/weather/site.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/weather/site.json
          key: weather-site-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fournir le bulletin préparé
        uses: actions/upload-artifact@v4
        with:
          name: bulletin-meteo-preview
          path: ${{ steps.bulletin.outputs.site-directory }}
          include-hidden-files: true
      - name: Préparer la publication
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.bulletin.outputs.site-directory }}
  publish:
    needs: prepare
    if: github.ref_name == github.event.repository.default_branch && needs.prepare.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
